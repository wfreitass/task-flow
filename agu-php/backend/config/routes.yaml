# Cada contexto com endpoints HTTP registra aqui o diretório dos seus controllers.
task_controllers:
    resource: '../src/Task/Presentation/Http/Controller/'
    type: attribute

# A rota precisa existir para o roteador casá-la; quem processa o login é o firewall `login`
# (json_login em config/packages/security.yaml), então não há controller.
api_login:
    path: /api/login
    methods: [POST]
