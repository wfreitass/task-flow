doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        use_savepoints: true
        types:
            # Converte o enum TaskStatus no id do catálogo task_statuses.
            task_status: App\Task\Infrastructure\Persistence\Doctrine\Type\TaskStatusType
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        controller_resolver:
            auto_mapping: false
        # Mapeamento por atributos PHP (#[ORM\...]) nas entidades de cada contexto.
        mappings:
            Task:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Task/Domain/Entity'
                prefix: 'App\Task\Domain\Entity'
                alias: Task
            User:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/User/Domain/Entity'
                prefix: 'App\User\Domain\Entity'
                alias: User
