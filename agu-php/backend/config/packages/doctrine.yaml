doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        use_savepoints: true
        types:
            # Converte o enum TaskStatus no id do catálogo task_statuses.
            task_status: App\Task\Infrastructure\Persistence\Doctrine\Type\TaskStatusType
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        controller_resolver:
            auto_mapping: false
        # Entidades de PERSISTÊNCIA (modelos do Doctrine, com atributos #[ORM\...]) ficam na infraestrutura de
        # cada contexto. As entidades de domínio são classes puras, ligadas a elas pelos mappers.
        mappings:
            Task:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Task/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Task\Infrastructure\Persistence\Doctrine\Entity'
            User:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/User/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\User\Infrastructure\Persistence\Doctrine\Entity'
