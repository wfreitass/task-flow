security:
  password_hashers:
    App\User\Infrastructure\Security\SecurityUser:
      algorithm: auto

  providers:
    app_user_provider:
      id: App\User\Infrastructure\Security\UserProvider

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    # Cadastro e login: públicos, e ignoram qualquer token enviado.
    # O login é um caso de uso (AuthenticateUserService); o JWT é emitido pelo LexikJWTAuthenticationBundle.
    public:
      pattern: ^/api/(login|register)$
      security: false

    # Demais rotas da API: exigem JWT válido (Authorization: Bearer <token>).
    api:
      pattern: ^/api
      stateless: true
      provider: app_user_provider
      jwt: ~

  access_control:
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
