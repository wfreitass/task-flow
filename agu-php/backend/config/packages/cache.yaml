framework:
    cache:
        pools:
            # Cache de dados da aplicação (ex.: listagem de tarefas), com tags para invalidar por usuário.
            # Usado pela porta CacheInterface (TaggedPoolCache). O adaptador com tags exige que o Redis não
            # descarte chaves sozinho (maxmemory-policy noeviction, o padrão do Redis do docker-compose).
            cache.app_data:
                adapter: cache.adapter.redis_tag_aware
                default_lifetime: 300

# Redis no desenvolvimento e em produção (REDIS_URL vem do docker-compose).
when@dev:
    framework:
        cache:
            default_redis_provider: '%env(REDIS_URL)%'

when@prod:
    framework:
        cache:
            default_redis_provider: '%env(REDIS_URL)%'

# Nos testes não há Redis: o pool vive em memória, apenas durante o processo.
when@test:
    framework:
        cache:
            pools:
                cache.app_data:
                    adapter: cache.adapter.array
                    tags: true
