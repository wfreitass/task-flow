# Nome fixo do projeto: isola contêineres, rede e volumes (prefixo "taskflow_") de outros projetos
# que usem o nome da pasta como padrão.
name: taskflow

services:
  # Servidor HTTP: recebe as requisições em http://localhost:8000 e repassa ao PHP-FPM.
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
    configs:
      - source: nginx_default
        target: /etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy

  # PHP-FPM. Ao iniciar, o próprio Dockerfile aplica as migrations (ver o CMD em backend/Dockerfile).
  backend:
    build: ./backend
    image: taskflow-backend
    container_name: backend
    # Porta do PHP-FPM só na rede interna; o acesso externo é pelo Nginx.
    expose:
      - "9000"
    volumes:
      - ./backend:/var/www/html
    networks:
      - app-network
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://user:password@mysql_db:3306/dbname?serverVersion=8.0&charset=utf8mb4
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://127.0.0.1:4200
      - COMPOSER_ALLOW_SUPERUSER=1
      # Redis, RabbitMQ e OpenSearch:
      - REDIS_URL=redis://redis:6379
      - MESSENGER_TRANSPORT_DSN=amqp://user:password@rabbitmq:5672/%2f/messages
      - OPENSEARCH_URL=http://opensearch:9200
      # E-mail (Mailpit) e mensageria (RabbitMQ) usados na notificação de tarefa atribuída:
      - MAILER_DSN=smtp://mailpit:1025
      - "MAIL_FROM=TaskFlow <no-reply@taskflow.local>"
      # Tempo real (WebSocket): o segredo protege o endpoint interno de entrega do serviço `websocket`.
      - REALTIME_PUSH_URL=http://websocket:8081/push
      - REALTIME_PUSH_TOKEN=${REALTIME_PUSH_TOKEN:-dev-realtime-token}
    healthcheck:
      # Saudável quando o PHP-FPM já aceita conexões, ou seja, depois das migrations.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  # Consumidor das filas do RabbitMQ: trata, fora das requisições, os eventos que a API publica (hoje, o aviso por
  # e-mail de tarefa atribuída). Usa a mesma imagem do backend. Roda como www-data, como o PHP-FPM, para os dois
  # compartilharem o cache da aplicação sem conflito de permissão. Mensagens com falha: messenger:failed:show.
  worker:
    build: ./backend
    image: taskflow-backend
    container_name: worker
    user: "33:33"
    # Ao subir, cria o índice de busca e o popula se ele ainda não existir (--if-missing); depois consome a fila.
    command:
      - sh
      - -c
      - php bin/console app:search:reindex --if-missing || echo "Índice de busca não preparado (OpenSearch fora do ar?)"; exec php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -vv
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
      mysql_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://user:password@mysql_db:3306/dbname?serverVersion=8.0&charset=utf8mb4
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://127.0.0.1:4200
      - OPENSEARCH_URL=http://opensearch:9200
      - REDIS_URL=redis://redis:6379
      - MESSENGER_TRANSPORT_DSN=amqp://user:password@rabbitmq:5672/%2f/messages
      - MAILER_DSN=smtp://mailpit:1025
      - "MAIL_FROM=TaskFlow <no-reply@taskflow.local>"
      - REALTIME_PUSH_URL=http://websocket:8081/push
      - REALTIME_PUSH_TOKEN=${REALTIME_PUSH_TOKEN:-dev-realtime-token}

  # Servidor de tempo real (WebSocket). Os navegadores conectam em ws://localhost:8000/ws (o Nginx repassa para a
  # porta 8080 daqui); a porta 8081 é interna: é por ela que o worker entrega as mensagens (POST /push). Mesma
  # imagem do backend e mesmo usuário (www-data) do worker.
  websocket:
    build: ./backend
    image: taskflow-backend
    container_name: websocket
    user: "33:33"
    command: ["php", "bin/console", "app:realtime:serve"]
    restart: unless-stopped
    expose:
      - "8080"
      - "8081"
    volumes:
      - ./backend:/var/www/html
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
      mysql_db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://user:password@mysql_db:3306/dbname?serverVersion=8.0&charset=utf8mb4
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://127.0.0.1:4200
      - REALTIME_PUSH_URL=http://websocket:8081/push
      - REALTIME_PUSH_TOKEN=${REALTIME_PUSH_TOKEN:-dev-realtime-token}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8081/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mysql_db:
    image: mysql:8.0
    # Apenas desenvolvimento: permite criar triggers com o usuário da aplicação.
    command: --default-time-zone=+00:00 --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: dbname
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  # Cache de dados da aplicação (hoje, a listagem de tarefas; ver config/packages/cache.yaml).
  # Sem persistência de propósito (--save "" --appendonly no): é só cache. Assim, se o Redis cair e voltar, ele
  # começa vazio e nenhum dado velho sobrevive à queda. Se a invalidação falhar com o Redis fora do ar, um
  # cache persistido serviria a entrada antiga até expirar. Não use este Redis para dados que precisem durar.
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  # Filas do Symfony Messenger (futuro). Painel em http://localhost:15672 (user / password).
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - app-network

  # Busca textual de tarefas (índice `taskflow_tasks`; ver Task/Infrastructure/Search). Apenas desenvolvimento: nó único e segurança desligada (HTTP sem login).
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      - app-network

  # Servidor de e-mail de desenvolvimento: recebe por SMTP (porta 1025, só na rede interna) e NÃO envia nada
  # para fora. Os e-mails aparecem na interface em http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  # Painel do Redis (RedisInsight): http://localhost:5540. Só desenvolvimento. Na primeira vez, adicione o banco com
  # host `redis` e porta 6379 (sem senha); a conexão fica salva no volume. Útil para ver as chaves do cache da
  # listagem de tarefas (tasks_list_*), o TTL e o monitor de comandos.
  redisinsight:
    image: redis/redisinsight:2.60
    container_name: redisinsight
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  # Painel do OpenSearch (Dashboards): http://localhost:5601. Só desenvolvimento, com a segurança desligada como no
  # OpenSearch. Em "Dev Tools" dá para testar buscas no índice `taskflow_tasks`; para ver os documentos em
  # "Discover", crie antes o index pattern `taskflow_tasks*` (Dashboards Management).
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - app-network

# Configuração do Nginx embutida aqui. Os "$$" são o escape do "$" do Nginx dentro do Compose.
configs:
  nginx_default:
    content: |
      server {
          listen 80;
          server_name _;
          root /var/www/html/public;
          # Igual ao post_max_size do PHP (backend/Dockerfile). O Nginx barra o excesso na hora; se o limite fosse maior,
          # ele despejaria o corpo inteiro no PHP-FPM, que o descarta sem ler, e a requisição ficaria presa até o timeout.
          client_max_body_size 55m;
          error_page 413 @payload_too_large;

          # WebSocket (tempo real): repassa para o serviço `websocket`. O endereço vai numa variável, resolvida
          # na hora da conexão, para o Nginx subir mesmo com esse serviço fora do ar.
          location /ws {
              resolver 127.0.0.11 valid=10s;
              set $$ws_upstream websocket:8080;
              proxy_pass http://$$ws_upstream;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
              proxy_set_header Origin $$http_origin;
              # Conexão longa: sem isto o Nginx a derrubaria após 60 s sem tráfego.
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
          }

          location / {
              try_files $$uri /index.php$$is_args$$args;
          }

          # Todas as rotas passam pelo front controller do Symfony (public/index.php).
          location ~ ^/index\.php(/|$$) {
              fastcgi_pass backend:9000;
              fastcgi_split_path_info ^(.+\.php)(/.*)$$;
              include fastcgi_params;
              fastcgi_param SCRIPT_FILENAME $$realpath_root$$fastcgi_script_name;
              fastcgi_param DOCUMENT_ROOT $$realpath_root;
              internal;
          }

          # Resposta 413 em JSON, no mesmo formato de erro da API.
          location @payload_too_large {
              default_type application/json;
              return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"O envio excede o tamanho máximo permitido para a requisição.","details":{}}}';
          }

          # Nenhum outro arquivo .php é executável.
          location ~ \.php$$ {
              return 404;
          }
      }

volumes:
  mysql_data:
  rabbitmq_data:
  opensearch_data:
  redisinsight_data:

networks:
  app-network:
    driver: bridge
