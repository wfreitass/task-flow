version: '3.8'

services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/var/www/html
    networks:
      - app-network
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://user:password@mysql_db:3306/dbname?serverVersion=8.0&charset=utf8mb4
      - COMPOSER_ALLOW_SUPERUSER=1

  mysql_db:
    image: mysql:8.0
    # Apenas desenvolvimento: permite criar triggers com o usuário da aplicação.
    command: --default-time-zone=+00:00 --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: dbname
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
