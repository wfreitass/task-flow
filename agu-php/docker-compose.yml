# Nome fixo do projeto: isola contêineres, rede e volumes (prefixo "taskflow_") de outros projetos
# que usem o nome da pasta como padrão.
name: taskflow

services:
  # Servidor HTTP: recebe as requisições em http://localhost:8000 e repassa ao PHP-FPM.
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
    configs:
      - source: nginx_default
        target: /etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy

  # PHP-FPM. Ao iniciar, o próprio Dockerfile aplica as migrations (ver o CMD em backend/Dockerfile).
  backend:
    build: ./backend
    container_name: backend
    # Porta do PHP-FPM só na rede interna; o acesso externo é pelo Nginx.
    expose:
      - "9000"
    volumes:
      - ./backend:/var/www/html
    networks:
      - app-network
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://user:password@mysql_db:3306/dbname?serverVersion=8.0&charset=utf8mb4
      - COMPOSER_ALLOW_SUPERUSER=1
      # Integrações futuras (ainda não usadas pela aplicação):
      - REDIS_URL=redis://redis:6379
      - MESSENGER_TRANSPORT_DSN=amqp://user:password@rabbitmq:5672/%2f/messages
      - OPENSEARCH_URL=http://opensearch:9200
    healthcheck:
      # Saudável quando o PHP-FPM já aceita conexões, ou seja, depois das migrations.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  mysql_db:
    image: mysql:8.0
    # Apenas desenvolvimento: permite criar triggers com o usuário da aplicação.
    command: --default-time-zone=+00:00 --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: dbname
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  # Cache e rate limiting (futuro).
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  # Filas do Symfony Messenger (futuro). Painel em http://localhost:15672 (user / password).
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - app-network

  # Busca textual (futuro). Apenas desenvolvimento: nó único e segurança desligada (HTTP sem login).
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      - app-network

# Configuração do Nginx embutida aqui. Os "$$" são o escape do "$" do Nginx dentro do Compose.
configs:
  nginx_default:
    content: |
      server {
          listen 80;
          server_name _;
          root /var/www/html/public;
          client_max_body_size 10m;

          location / {
              try_files $$uri /index.php$$is_args$$args;
          }

          # Todas as rotas passam pelo front controller do Symfony (public/index.php).
          location ~ ^/index\.php(/|$$) {
              fastcgi_pass backend:9000;
              fastcgi_split_path_info ^(.+\.php)(/.*)$$;
              include fastcgi_params;
              fastcgi_param SCRIPT_FILENAME $$realpath_root$$fastcgi_script_name;
              fastcgi_param DOCUMENT_ROOT $$realpath_root;
              internal;
          }

          # Nenhum outro arquivo .php é executável.
          location ~ \.php$$ {
              return 404;
          }
      }

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  opensearch_data:

networks:
  app-network:
    driver: bridge
